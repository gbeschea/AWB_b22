# Shopify app configuration for AWB Hub (standalone SaaS, login-via-Shopify).
# Fill client_id after registering the app in the Partner Dashboard.
# Deploy declared config/scopes/webhooks with:
#   shopify app deploy --client-id=<id>
#
# NOTE: this is a STANDALONE app (embedded = false) — like xConnector, the merchant
# installs via Shopify OAuth then works in AWB Hub's own UI, not inside the Shopify
# admin iframe. All URLs must be HTTPS and match the live host.

client_id = "REPLACE_WITH_PARTNER_DASHBOARD_CLIENT_ID"
name = "AWB Hub"
handle = "awb-hub"
application_url = "https://REPLACE_WITH_APP_HOST"
embedded = false

[access_scopes]
# read/write_orders: read order + customer PII for AWB, capture COD, mark-as-paid, tag.
# fulfillment scopes: create fulfillments / attach tracking when the AWB is generated.
scopes = "read_orders,write_orders,read_fulfillments,write_fulfillments,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_products"

[auth]
redirect_urls = [
  "https://REPLACE_WITH_APP_HOST/auth/callback"
]

[webhooks]
api_version = "2026-04"

  # Operational webhook the app already handles.
  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders/updated"

  # Recommended: keep the local Store row's install state in sync.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # MANDATORY GDPR / privacy-compliance webhooks (added by the hardening pass).
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://REPLACE_WITH_APP_HOST/webhooks/customers/data_request"
  customer_deletion_url     = "https://REPLACE_WITH_APP_HOST/webhooks/customers/redact"
  shop_deletion_url         = "https://REPLACE_WITH_APP_HOST/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true
